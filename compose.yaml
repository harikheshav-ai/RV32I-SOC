services:
  rv32i:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: rv32i-dev:latest
    # Run as the host user so files written to the bind mount are not
    # root-owned on Linux. Bash does not export UID/GID, so set HOST_UID and
    # HOST_GID (see README); the default 1000:1000 suits most single-user hosts.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: ["make", "test"]

  # Linux hardware access. USB/JTAG devices must be exposed by the Docker
  # host; set USB_SERIAL_DEVICE when the UART is not /dev/ttyUSB1.
  rv32i-hardware:
    extends:
      service: rv32i
    profiles: ["hardware"]
    privileged: true
    # USB/JTAG device nodes are normally root-only, so this service keeps root.
    user: "0:0"
    devices:
      - "${USB_SERIAL_DEVICE:-/dev/ttyUSB1}:/dev/ttyUSBX"
    volumes:
      - .:/workspace
      - /dev/bus/usb:/dev/bus/usb
